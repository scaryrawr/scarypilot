name: Pstack portable helpers

on:
  pull_request:
    paths:
      - ".github/workflows/pstack-portable.yml"
      - "external_plugins/pstack/**"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pstack-portable.yml"
      - "external_plugins/pstack/**"

permissions:
  contents: read

jobs:
  platform-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.18.0"
      - name: Check portable artifact validation and confinement
        run: >-
          node --test
          external_plugins/pstack/skills/pstack-schema-validate/tests/validation.test.mjs
          external_plugins/pstack/skills/pstack-schema-validate/tests/workspace-reader.test.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.3"
      - name: Install CLI test and typecheck dependencies
        working-directory: external_plugins/pstack/skills/poteto-mode/scripts
        run: bun install --ignore-scripts
      - name: Check orchestration and watcher scripts
        working-directory: external_plugins/pstack/skills/poteto-mode/scripts
        run: bun test
      - name: Check CLI types
        working-directory: external_plugins/pstack/skills/poteto-mode/scripts
        run: bun run typecheck
      - name: Set up Java for statechart model checking
        if: runner.os != 'Windows'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - name: Provision pinned official TLC
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pstack-tlc"
          jar="$RUNNER_TEMP/pstack-tlc/tla2tools-1.8.0.jar"
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar \
            --output "$jar"
          printf '%s  %s\n' \
            5bd7b64db99ae4c6c35f290de5e809c0ee41af43f8699cf696099ffb6452b1e2 \
            "$jar" | shasum -a 256 --check
          printf 'TLA2TOOLS=%s\nJAVA=%s/bin/java\n' "$jar" "$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Check sync policy and portable helpers
        env:
          PSTACK_REQUIRE_TLC: ${{ runner.os != 'Windows' && '1' || '0' }}
        run: >-
          node external_plugins/pstack/tools/pstack-sync.mjs check &&
          node --test
          external_plugins/pstack/tools/pstack-sync.test.mjs
          external_plugins/pstack/tools/pstack-plan.test.mjs
          external_plugins/pstack/tools/log.test.mjs
          external_plugins/pstack/skills/statechart/scripts/test/statechart.test.mjs
      - name: Check the legacy POSIX worktree audit
        if: runner.os != 'Windows'
        working-directory: .
        run: node --test external_plugins/pstack/tools/worktree-audit.test.mjs
