name: Extension bundles

on:
  pull_request:
    paths:
      - ".github/workflows/extension-bundles.yml"
      - "tools/check-extension-bundles.mjs"
      - "tools/smoke-extension-bundles.mjs"
      - "plugins/*/extensions/**"
      - "external_plugins/*/extensions/**"
      - "external_plugins/pstack/skills/poteto-mode/scripts/plan-rules.mjs"
      - "external_plugins/pstack/skills/poteto-mode/scripts/orch/store.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/extension-bundles.yml"
      - "tools/check-extension-bundles.mjs"
      - "tools/smoke-extension-bundles.mjs"
      - "plugins/*/extensions/**"
      - "external_plugins/*/extensions/**"
      - "external_plugins/pstack/skills/poteto-mode/scripts/plan-rules.mjs"
      - "external_plugins/pstack/skills/poteto-mode/scripts/orch/store.ts"

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"
      - run: node tools/check-extension-bundles.mjs check
      - run: node tools/smoke-extension-bundles.mjs
