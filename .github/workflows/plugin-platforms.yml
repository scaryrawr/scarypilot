name: Plugin platform contracts

on:
  pull_request:
    paths:
      - ".github/workflows/plugin-platforms.yml"
      - ".github/plugin/marketplace.json"
      - "tools/plugin-manifests.test.mjs"
      - "plugins/better-init/**"
      - "plugins/ado-codespaces/**"
      - "plugins/anti-slop/**"
      - "plugins/copilot-autoresearch/**"
      - "plugins/digivolution/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/plugin-platforms.yml"
      - ".github/plugin/marketplace.json"
      - "tools/plugin-manifests.test.mjs"
      - "plugins/better-init/**"
      - "plugins/ado-codespaces/**"
      - "plugins/anti-slop/**"
      - "plugins/copilot-autoresearch/**"
      - "plugins/digivolution/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.18.0"
      - name: Check manifest loading formats and component paths
        run: node --test tools/plugin-manifests.test.mjs

  extensions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        plugin: [ado-codespaces, copilot-autoresearch, digivolution]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}/extensions/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.18.0"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Use Git for Windows Bash for experiments
        if: runner.os == 'Windows' && matrix.plugin == 'copilot-autoresearch'
        shell: pwsh
        run: |
          $bash = Join-Path $env:ProgramFiles "Git\bin\bash.exe"
          if (-not (Test-Path $bash)) { throw "Git for Windows Bash is required" }
          Split-Path $bash | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check types
        run: npm run typecheck
      - name: Check runtime contracts
        run: npm test

  anti-slop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.18.0"
      - name: Install locked lint runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check hooks and scan contracts
        run: node --test plugins/anti-slop/hooks/guard.test.mjs plugins/anti-slop/hooks/post-guard.test.mjs plugins/anti-slop/skills/anti-slop/scripts/scan.test.mjs
