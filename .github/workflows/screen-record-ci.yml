name: Screen recording contracts

on:
  pull_request:
    paths:
      - ".github/workflows/screen-record-ci.yml"
      - "plugins/screen-record/**"
  push:
    paths:
      - ".github/workflows/screen-record-ci.yml"
      - "plugins/screen-record/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Capture-free contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/screen-record/extensions/screen-record
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.18.0"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check shipped bundle and helper freshness
        run: npm run check:bundle
      - name: Check types
        run: npm run typecheck
      - name: Test real lifecycle with fixture media subprocesses
        run: npm test
      - name: Build extension
        run: npm run build
      - name: Check rebuilt bundle
        run: npm run check:bundle
      - name: Require reproducible generated artifacts
        run: git diff --exit-code -- dist/extension.mjs bundle-manifest.json
